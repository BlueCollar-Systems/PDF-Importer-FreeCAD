name: auto-release

on:
  push:
    branches: [main]
    # Docs-only pushes do not mint a release (board Q-08-a / ANS-09-1).
    # Release-pipeline workflow edits under .github/ are NOT ignored: they must
    # rebuild --latest assets. The job if: guard and the bookkeeping path guard
    # keep post-publication records from recursively minting product releases.
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "_archived/**"
      - "dist/_archived/**"
      - "dev_logs/**"
      - "steel_shapes/**"
      # Digest bookkeeping is generated only after immutable publication. It
      # must never recursively mint another product release.
      - "release-bookkeeping/**"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

defaults:
  run:
    shell: bash

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  version-build-release:
    if: "!startsWith(github.event.head_commit.message, 'chore: bump version to') && !contains(github.event.head_commit.message, 'automation/version-bump') && !contains(github.event.head_commit.message, '[skip release]')"
    runs-on: windows-latest
    env:
      # Private identifiers stay in a masked repository secret and never enter
      # source control, logs, packages, or attestations. The builder fails closed
      # when this value is absent or malformed.
      BCS_PRIVATE_RELEASE_DENYLIST_B64: ${{ secrets.FREECAD_PRIVATE_RELEASE_DENYLIST_B64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          # Keep checkout on the job-scoped token. Bookkeeping follows branch
          # protection through a narrowly scoped pull request below.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.10 runtime builder
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Capture Python 3.10 interpreter
        run: echo "PYTHON310=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"

      - name: Set up Python 3.11 release driver
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Capture Python 3.11 interpreter
        run: echo "PYTHON311=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"

      - name: Install release gate dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable . pytest

      - name: Run release gate tests
        run: |
          python pdfcadcore_sync_check.py --skip-cross-repo
          python -m compileall PDFVectorImporter
          # Vendor the bundled PyMuPDF into src/lib BEFORE the gate: tests such as
          # test_diagnostics_reports_bundled_pymupdf require the bundled runtime,
          # and src/lib is gitignored/empty on a fresh checkout (vendoring otherwise
          # only happens later in build_release.py). Idempotent - build reuses it.
          python -c "import os,pathlib,build_release; build_release.ensure_runtime_dependencies(python310=pathlib.Path(os.environ['PYTHON310']), python311=pathlib.Path(os.environ['PYTHON311']))"
          python -m pytest tests/ -q --basetemp "$RUNNER_TEMP/pytest-freecad"

      - name: Read committed version
        id: version
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re

          package_xml = pathlib.Path("PDFVectorImporter/package.xml")
          package_text = package_xml.read_text(encoding="utf-8")

          match = re.search(r"<version>(\d+\.\d+\.\d+)</version>", package_text)
          if not match:
              raise SystemExit("Could not find <version> in PDFVectorImporter/package.xml")
          version = match.group(1)

          pyproject_text = pathlib.Path("pyproject.toml").read_text(encoding="utf-8")
          pyproject_match = re.search(r'^version\s*=\s*"(\d+\.\d+\.\d+)"', pyproject_text, re.MULTILINE)
          if not pyproject_match or pyproject_match.group(1) != version:
              got = pyproject_match.group(1) if pyproject_match else "missing"
              raise SystemExit(f"Version mismatch: package={version} pyproject={got}")

          for readme in [pathlib.Path("README.md"), pathlib.Path("PDFVectorImporter/README.md")]:
              readme_text = readme.read_text(encoding="utf-8")
              badge_match = re.search(r"Version-(\d+\.\d+\.\d+)-(?:green|blue)\.svg", readme_text)
              if not badge_match or badge_match.group(1) != version:
                  got = badge_match.group(1) if badge_match else "missing"
                  raise SystemExit(f"Version mismatch: package={version} {readme}={got}")

          out = pathlib.Path(os.environ["GITHUB_OUTPUT"])
          out.write_text(f"version={version}\n", encoding="utf-8")
          PY

      - name: Set release target
        run: |
          echo "RELEASE_TARGET=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Build release zip
        run: python build_release.py --python310 "$PYTHON310" --python311 "$PYTHON311"

      - name: Install pinned Inno Setup toolchain
        shell: pwsh
        run: |
          ./scripts/install_inno_toolchain.ps1 `
            -ManifestPath installer/inno-toolchain-6.7.1.json `
            -Destination "$env:RUNNER_TEMP\inno-6.7.1"

      - name: Build and compare Windows installers from the same canonical ZIP
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $zip = "FreeCAD-PDF-Importer_v$version.zip"
          $base = "FreeCAD-PDF-Importer-Setup_v$version"
          $iscc = Join-Path $env:INNO_TOOLCHAIN_ROOT 'ISCC.exe'
          $first = Join-Path 'dist/repro-a' ($base + '.exe')
          $second = Join-Path 'dist/repro-b' ($base + '.exe')
          $firstAttestation = Join-Path 'dist/repro-a' ($base + '.attestation.json')
          $secondAttestation = Join-Path 'dist/repro-b' ($base + '.attestation.json')

          python build_windows_installer.py --source-zip $zip --iscc $iscc `
            --toolchain-manifest installer/inno-toolchain-6.7.1.json `
            --output-dir dist/repro-a --stage-dir dist/stage-a `
            --attestation $firstAttestation --source-commit $env:RELEASE_TARGET
          if ($LASTEXITCODE -ne 0) { throw 'First installer build failed.' }
          python build_windows_installer.py --source-zip $zip --iscc $iscc `
            --toolchain-manifest installer/inno-toolchain-6.7.1.json `
            --output-dir dist/repro-b --stage-dir dist/stage-b `
            --attestation $secondAttestation --source-commit $env:RELEASE_TARGET
          if ($LASTEXITCODE -ne 0) { throw 'Second installer build failed.' }

          $firstHash = (Get-FileHash -LiteralPath $first -Algorithm SHA256).Hash
          $secondHash = (Get-FileHash -LiteralPath $second -Algorithm SHA256).Hash
          if ($firstHash -ne $secondHash) {
            throw "Setup.exe is not reproducible: $firstHash != $secondHash"
          }
          $attestationDifference = Compare-Object `
            (Get-Content -LiteralPath $firstAttestation -Raw) `
            (Get-Content -LiteralPath $secondAttestation -Raw)
          if ($attestationDifference) {
            throw 'Installer attestations are not reproducible.'
          }

          Copy-Item -LiteralPath $first -Destination (Join-Path 'dist' ($base + '.exe'))
          Copy-Item -LiteralPath $firstAttestation `
            -Destination (Join-Path 'dist' ($base + '.attestation.json'))

      - name: Smoke release zip dependency payload
        run: python scripts/smoke_release_zip.py "FreeCAD-PDF-Importer_v*.zip" --python310 "$PYTHON310" --python311 "$PYTHON311"

      - name: Create or verify exact tag and release
        id: mint
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          VERSION="v${{ steps.version.outputs.version }}"
          ZIP="FreeCAD-PDF-Importer_v${{ steps.version.outputs.version }}.zip"
          SETUP="dist/FreeCAD-PDF-Importer-Setup_v${{ steps.version.outputs.version }}.exe"
          ATTESTATION="dist/FreeCAD-PDF-Importer-Setup_v${{ steps.version.outputs.version }}.attestation.json"
          NOTES="Automated immutable release from main. Run $(basename "${SETUP}") for Windows setup, or extract ${ZIP} into the FreeCAD Mod folder. The attestation binds Setup.exe to the exact canonical ZIP and pinned compiler tree."

          python scripts/publish_release.py \
            --repo "${GITHUB_REPOSITORY}" \
            --tag "${VERSION}" \
            --target "${RELEASE_TARGET:-$GITHUB_SHA}" \
            --title "${VERSION} — PDF Vector Importer for FreeCAD" \
            --notes "${NOTES}" \
            --asset "${ZIP}" --asset "${SETUP}" --asset "${ATTESTATION}" \
            --github-output "$GITHUB_OUTPUT"

          if grep -q '^minted=false$' "$GITHUB_OUTPUT"; then
            # Preserve the bounded stranded-release audit for already-published
            # releases without allowing it to mutate immutable assets.
            python scripts/release_safety.py audit-existing-tag \
              --repo "${GITHUB_REPOSITORY}" \
              --tag "${VERSION}" \
              --before "${{ github.event.before }}" \
              --head "$GITHUB_SHA" \
              --session-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
              --mode release \
              --summary "$GITHUB_STEP_SUMMARY" \
              --warnings-file .release-safety/warnings.json
          fi

      - name: Record verified release artifact digests without a release loop
        if: steps.mint.outputs.release_verified == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="v${{ steps.version.outputs.version }}"
          ZIP="FreeCAD-PDF-Importer_v${{ steps.version.outputs.version }}.zip"
          SETUP="dist/FreeCAD-PDF-Importer-Setup_v${{ steps.version.outputs.version }}.exe"
          ATTESTATION="dist/FreeCAD-PDF-Importer-Setup_v${{ steps.version.outputs.version }}.attestation.json"
          RECORD="release-bookkeeping/${VERSION}.json"

          asset_identity() {
            python -c "import hashlib,pathlib,sys; p=pathlib.Path(sys.argv[1]); print(f'{p.name}:{p.stat().st_size}:{hashlib.sha256(p.read_bytes()).hexdigest()}')" "$1"
          }

          python scripts/release_bookkeeping.py record \
            --tag "$VERSION" \
            --target "$RELEASE_TARGET" \
            --asset "$(asset_identity "$ZIP")" \
            --asset "$(asset_identity "$SETUP")" \
            --asset "$(asset_identity "$ATTESTATION")"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$RECORD"
          if git diff --cached --quiet -- "$RECORD"; then
            echo "Bookkeeping already matches the verified immutable release."
            exit 0
          fi
          CHANGED="$(git diff --cached --name-only)"
          if [ "$CHANGED" != "$RECORD" ]; then
            echo "Refusing bookkeeping commit outside $RECORD: $CHANGED" >&2
            exit 1
          fi
          SUBJECT="$(python scripts/release_bookkeeping.py subject --tag "$VERSION")"
          git commit -m "$SUBJECT"

          # Never bypass main's protection. A stable, release-specific branch
          # makes reruns convergent and the bookkeeping-only main push cannot
          # recursively mint another release because of paths-ignore above.
          BRANCH="automation/release-bookkeeping-${VERSION}"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            git fetch --no-tags origin "$BRANCH"
            REMOTE_RECORD="$(mktemp)"
            git show "FETCH_HEAD:$RECORD" > "$REMOTE_RECORD"
            if ! cmp -- "$RECORD" "$REMOTE_RECORD"; then
              echo "Existing $BRANCH has a different $RECORD; refusing to overwrite it." >&2
              exit 1
            fi
          else
            git switch -c "$BRANCH"
            git push origin "HEAD:refs/heads/$BRANCH"
          fi

          PR_STATE="$(gh pr view "$BRANCH" --json state --jq .state 2>/dev/null || true)"
          if [ -z "$PR_STATE" ]; then
            gh pr create --base main --head "$BRANCH" \
              --title "$SUBJECT" \
              --body "Records the already-verified immutable ${VERSION} artifact identities. This bookkeeping-only change is release-loop-safe."
          elif [ "$PR_STATE" != "OPEN" ] && [ "$PR_STATE" != "MERGED" ]; then
            echo "Bookkeeping PR for $BRANCH is $PR_STATE; refusing to create a duplicate." >&2
            exit 1
          fi

      - name: Check website dispatch token secret
        if: steps.mint.outputs.minted == 'true'
        id: website_dispatch_token
        env:
          WEBSITE_DISPATCH_TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN || secrets.BLUECOLLAR_WEBSITE_DISPATCH_TOKEN || secrets.REPO_DISPATCH_TOKEN }}
        run: |
          if [ -n "$WEBSITE_DISPATCH_TOKEN" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch website release update
        if: steps.mint.outputs.minted == 'true' && steps.website_dispatch_token.outputs.has_token == 'true'
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.WEBSITE_DISPATCH_TOKEN || secrets.BLUECOLLAR_WEBSITE_DISPATCH_TOKEN || secrets.REPO_DISPATCH_TOKEN }}
          script: |
            const tag = 'v${{ steps.version.outputs.version }}';
            const payload = {
              source_repo: context.repo.owner + '/' + context.repo.repo,
              source_event: 'auto-release',
              source_ref: context.ref,
              source_sha: context.sha,
              release_tag: tag,
              release_name: tag,
              release_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/releases/tag/${tag}`,
            };

            await github.request('POST /repos/{owner}/{repo}/dispatches', {
              owner: 'BlueCollar-Systems',
              repo: 'BlueCollar-Website',
              event_type: 'product-release',
              client_payload: payload,
            });

            core.info('Dispatched product-release to BlueCollar-Website');

      - name: Warn when website dispatch token is missing
        if: steps.mint.outputs.minted == 'true' && steps.website_dispatch_token.outputs.has_token != 'true'
        run: |
          echo "::warning::Skipping website dispatch because no valid dispatch token secret is configured."
          echo "Set WEBSITE_DISPATCH_TOKEN (or BLUECOLLAR_WEBSITE_DISPATCH_TOKEN / REPO_DISPATCH_TOKEN) to enable cross-repo dispatch."
