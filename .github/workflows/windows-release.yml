name: windows-release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release (example: v3.5.1)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install release gate dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable . pytest

      - name: Validate tag matches package version
        shell: pwsh
        run: |
          $tag = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ github.event.inputs.tag }}" } else { "${{ github.ref_name }}" }
          if (-not $tag.StartsWith("v")) {
            throw "Release tag must start with 'v'. Got: $tag"
          }

          $tagVersion = $tag.Substring(1)
          $packageXml = Get-Content -Raw "PDFVectorImporter/package.xml"
          $match = [regex]::Match($packageXml, "<version>(.*?)</version>")
          if (-not $match.Success) {
            throw "Could not find <version> in PDFVectorImporter/package.xml"
          }

          $packageVersion = $match.Groups[1].Value.Trim()
          if ($packageVersion -ne $tagVersion) {
            throw "Version mismatch: tag '$tag' != package.xml '$packageVersion'"
          }

          Write-Host "Version check passed: $tagVersion"

      - name: Run release gate tests
        shell: bash
        run: |
          python pdfcadcore_sync_check.py --skip-cross-repo
          python -m compileall PDFVectorImporter
          python -m pytest tests/ -q --basetemp "$RUNNER_TEMP/pytest-freecad"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      # The release ZIP was minted by auto-release in a different runner. It is
      # the canonical payload: rebuilding vendored console launchers here can
      # embed a different runner path and make Setup.exe install bytes that do
      # not match the companion ZIP.
      - name: Download canonical release ZIP
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}"
          SOURCE_ZIP="dist/FreeCAD-PDF-Importer_${TAG}.zip"
          mkdir -p dist
          gh release download "$TAG" \
            --pattern "FreeCAD-PDF-Importer_${TAG}.zip" \
            --dir dist
          test -f "$SOURCE_ZIP"
          echo "SOURCE_ZIP=$SOURCE_ZIP" >> "$GITHUB_ENV"

      - name: Build Setup.exe from canonical release ZIP
        shell: bash
        run: python build_windows_installer.py --source-zip "$SOURCE_ZIP"

      - name: Smoke release ZIP
        shell: bash
        run: python scripts/smoke_release_zip.py "dist/FreeCAD-PDF-Importer_v*.zip"

      - name: Upload build artifacts (workflow run)
        uses: actions/upload-artifact@v7
        with:
          name: PDFVectorImporter-release-assets
          path: |
            dist/*.zip
            dist/*.exe
          if-no-files-found: error

      # R17-1 immutability: a dispatch for an already-published tag must not
      # re-upload anything (v4.0.66 was clobber-re-uploaded on 2026-07-14,
      # byte-identical by luck, before overwrite_files:false landed). When the
      # release already has EVERY asset name this run built, warn and skip the
      # publish step entirely - mirroring the auto-release existing-release
      # skip. A partial set (e.g. auto-release uploaded the ZIP, Setup.exe
      # still missing) proceeds; overwrite_files:false below keeps the
      # existing assets untouched while the missing ones upload.
      - name: Guard against re-uploading existing release assets
        id: asset_guard
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}"
          shopt -s nullglob
          built=(dist/*.zip dist/*.exe)
          if [ "${#built[@]}" -eq 0 ]; then
            echo "::error::No built assets found under dist/ - nothing to publish."
            exit 1
          fi
          skip=false
          if gh release view "$TAG" --json assets --jq '.assets[].name' > existing_assets.txt 2>/dev/null; then
            missing=0
            for f in "${built[@]}"; do
              name="$(basename "$f")"
              if ! grep -Fxq "$name" existing_assets.txt; then
                missing=$((missing + 1))
                echo "Release $TAG is missing asset: $name"
              fi
            done
            if [ "$missing" -eq 0 ]; then
              echo "::warning::Release $TAG already has every asset this run built - release assets are immutable (R17-1); skipping upload."
              skip=true
            fi
          fi
          rm -f existing_assets.txt
          echo "skip_upload=$skip" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release assets
        if: steps.asset_guard.outputs.skip_upload != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          overwrite_files: false
          files: |
            dist/*.zip
            dist/*.exe
